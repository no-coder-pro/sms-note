<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS & Notification Live Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }

        .brand-text h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            color: #34d399;
            font-size: 13px;
            font-weight: 500;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-icon.total {
            background: rgba(139, 92, 246, 0.2);
            color: var(--accent-purple);
        }

        .stat-icon.sms {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
        }

        .stat-icon.apps {
            background: rgba(236, 72, 153, 0.2);
            color: var(--accent-pink);
        }

        /* Filter & Search Bar */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 16px 10px 40px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-purple);
        }

        .tabs {
            display: flex;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .tab {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: var(--accent-purple);
            color: white;
        }

        /* Message List */
        .message-list {
            display: grid;
            gap: 12px;
        }

        .message-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 14px;
            transition: all 0.2s ease;
            position: relative;
        }

        .message-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 12px;
        }

        .msg-sender {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .msg-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .msg-icon.sms {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .msg-icon.app {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
        }

        .sender-title {
            font-size: 15px;
            font-weight: 600;
        }

        .source-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            margin-left: 6px;
        }

        .msg-time {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .msg-body {
            font-size: 14px;
            line-height: 1.5;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            font-size: 13px;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-main);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--card-border);
        }

        .empty-state i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent-purple);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            font-size: 14px;
            font-weight: 500;
            display: opacity;
            transition: all 0.3s ease;
            z-index: 999;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-bell-concierge"></i>
                </div>
                <div class="brand-text">
                    <h1>SMS & Notification Dashboard</h1>
                    <p>Live Real-Time Message Tracker (Auto 7-Day Auto Cleanup Active)</p>
                </div>
            </div>
            <div class="controls">
                <div class="status-badge">
                    <span class="pulse-dot"></span>
                    <span>7-Day Retention Active</span>
                </div>
                <button class="btn" onclick="fetchMessages()">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <h3 id="statTotal">0</h3>
                    <p>Total Saved (Last 7 Days)</p>
                </div>
                <div class="stat-icon total"><i class="fa-solid fa-inbox"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3 id="statSms">0</h3>
                    <p>SIM SMS Messages</p>
                </div>
                <div class="stat-icon sms"><i class="fa-solid fa-comment-sms"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3 id="statApps">0</h3>
                    <p>App Notifications</p>
                </div>
                <div class="stat-icon apps"><i class="fa-solid fa-bell"></i></div>
            </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="filter-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by sender or text..."
                    oninput="filterMessages()">
            </div>
            <div class="tabs">
                <div class="tab active" onclick="setFilter('all', this)">All</div>
                <div class="tab" onclick="setFilter('sms', this)">SMS</div>
                <div class="tab" onclick="setFilter('app', this)">Apps</div>
            </div>
        </div>

        <!-- Message List Container -->
        <div id="messageList" class="message-list">
            <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Connecting to Supabase and loading messages...</p>
            </div>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = "https://gtsrotjwclecltvnpisa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0c3JvdGp3Y2xlY2x0dm5waXNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTQ0NjMsImV4cCI6MjEwMDk5MDQ2M30.us1TiobnWWk-qO7aFu3DKKUqNfdZQn90gej6Jtx7xKA";

        let allMessages = [];
        let currentFilter = 'all';

        async function fetchMessages() {
            try {
                // Auto purge messages older than 7 days (7 * 24 * 60 * 60 * 1000 = 604800000 ms)
                const sevenDaysAgo = Date.now() - 604800000;
                fetch(`${SUPABASE_URL}/rest/v1/notifications?created_at=lt.${sevenDaysAgo}`, {
                    method: "DELETE",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                }).catch(e => console.log("Auto purge skipped"));

                // Fetch current messages
                const response = await fetch(`${SUPABASE_URL}/rest/v1/notifications?select=*&order=id.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const data = await response.json();
                allMessages = data;

                updateStats();
                filterMessages();
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById("messageList").innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-circle-exclamation" style="color:#ef4444"></i>
                    <p>Unable to connect to Supabase database.<br><small style="color:var(--text-muted)">Please check if the 'notifications' table exists in Supabase.</small></p>
                </div>
            `;
            }
        }

        function updateStats() {
            document.getElementById("statTotal").innerText = allMessages.length;
            const smsCount = allMessages.filter(m => (m.source || "").toLowerCase().includes("sms")).length;
            const appCount = allMessages.length - smsCount;
            document.getElementById("statSms").innerText = smsCount;
            document.getElementById("statApps").innerText = appCount;
        }

        function setFilter(type, element) {
            currentFilter = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            filterMessages();
        }

        function filterMessages() {
            const query = document.getElementById("searchInput").value.toLowerCase();

            let filtered = allMessages.filter(m => {
                const isSms = (m.source || "").toLowerCase().includes("sms");
                if (currentFilter === 'sms' && !isSms) return false;
                if (currentFilter === 'app' && isSms) return false;

                const matchesSearch =
                    (m.sender || "").toLowerCase().includes(query) ||
                    (m.content || "").toLowerCase().includes(query) ||
                    (m.source || "").toLowerCase().includes(query);

                return matchesSearch;
            });

            renderList(filtered);
        }

        function renderList(messages) {
            const listContainer = document.getElementById("messageList");

            if (messages.length === 0) {
                listContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-envelope-open"></i>
                    <p>No messages found in database yet.</p>
                </div>
            `;
                return;
            }

            listContainer.innerHTML = messages.map(m => {
                const isSms = (m.source || "").toLowerCase().includes("sms");
                const iconClass = isSms ? 'sms fa-comment-sms' : 'app fa-bell';
                const iconType = isSms ? 'sms' : 'app';

                let formattedTime = "Just now";
                if (m.created_at) {
                    const date = new Date(typeof m.created_at === 'number' ? m.created_at : m.created_at);
                    formattedTime = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' - ' + date.toLocaleDateString();
                }

                return `
                <div class="message-card">
                    <div class="msg-header">
                        <div class="msg-sender">
                            <div class="msg-icon ${iconType}">
                                <i class="fa-solid ${iconClass}"></i>
                            </div>
                            <div>
                                <span class="sender-title">${escapeHtml(m.sender || 'Unknown Sender')}</span>
                                <span class="source-tag">${escapeHtml(m.source || 'General')}</span>
                            </div>
                        </div>
                        <div class="msg-time">${formattedTime}</div>
                    </div>
                    <div class="msg-body">${escapeHtml(m.content || '')}</div>
                    <div class="msg-actions">
                        <button class="icon-btn" onclick="copyText('${escapeHtml(m.content)}')"><i class="fa-regular fa-copy"></i> Copy</button>
                        <button class="icon-btn" onclick="deleteMessage(${m.id})" style="color:#f87171"><i class="fa-regular fa-trash-can"></i> Delete</button>
                    </div>
                </div>
            `;
            }).join("");
        }

        async function deleteMessage(id) {
            if (!confirm("Are you sure you want to delete this message?")) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/notifications?id=eq.${id}`, {
                    method: "DELETE",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                fetchMessages();
            } catch (e) {
                alert("Failed to delete message");
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            showToast("Text copied to clipboard!");
        }

        function showToast(msg) {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Auto-fetch every 3 seconds
        fetchMessages();
        setInterval(fetchMessages, 3000);
    </script>

</body>

</html>
